[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlasae"
version = "0.1.0"
description = "Autoencoder atlases: learned charts, tangent bundles, and Stiefel-Whitney classes from data"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Eduardo Paluzo-Hidalgo", email = "epaluzo@us.es" },
    { name = "Yuichi Ike" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "tensorflow>=2.13",
]

[project.optional-dependencies]
tda = ["dreimac", "ripser", "persim"]  # cover.py, good_cover.py, sphere_good_cover.py

[project.urls]
# The package is released standalone; this repository is the paper's experiments.
Package = "https://github.com/EduPH/atlasae"

[tool.setuptools.packages.find]
where = ["src"]
